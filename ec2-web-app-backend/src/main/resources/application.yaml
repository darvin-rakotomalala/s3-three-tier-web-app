spring:
  application:
    name: ec2-web-app-backend

  jpa:
    properties:
      hibernate:
        # Note: You can remove dialect in Spring Boot 3+ / Hibernate 6+
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: 'true'
          batch_size: '50'
    hibernate:
      ddl-auto: 'update'

  datasource:
    driver-class-name: com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver
    url: jdbc-secretsmanager:postgresql://three-tier-dev-rds-postgres.conyo2aki51n.us-east-1.rds.amazonaws.com:5432/threetierdb
    username: three-tier-dev/rds/crud-db-credentials

  sql:
    init:
      mode: always
  main:
    lazy-initialization: 'true'

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    throw-exception-if-no-handler-found: 'true'

  resources:
    add-mappings: 'false'

cors:
  allowed:
    origins: '*'

application:
  description: '@project.description@'
  name: '@project.artifactId@'

build:
  timestamp: '@maven.build.timestamp@'
  version: '@project.version@'

server:
  port: '8080'

logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: INFO
