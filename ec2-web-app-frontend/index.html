<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cloud with Darvin</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>

    <!-- Fonts (same as main.css: --default-font, --heading-font, --nav-font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Quicksand:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 (main.css is built for Bootstrap 5.3) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"/>

    <!-- Your custom style -->
    <link rel="stylesheet" href="assets/css/main.css"/>

    <style>
        /* Page-specific tweaks so Bootstrap components follow main.css variables */
        .hero {
            padding: 60px 0;
        }

        .btn-primary {
            --bs-btn-bg: var(--accent-color);
            --bs-btn-border-color: var(--accent-color);
            --bs-btn-hover-bg: color-mix(in srgb, var(--accent-color), black 15%);
            --bs-btn-hover-border-color: color-mix(in srgb, var(--accent-color), black 15%);
            --bs-btn-active-bg: color-mix(in srgb, var(--accent-color), black 20%);
            --bs-btn-active-border-color: color-mix(in srgb, var(--accent-color), black 20%);
            --bs-btn-disabled-bg: var(--accent-color);
            --bs-btn-disabled-border-color: var(--accent-color);
        }

        .crud-card {
            background-color: var(--surface-color);
            border: 1px solid color-mix(in srgb, var(--default-color), transparent 90%);
            border-radius: 12px;
            box-shadow: 0 5px 25px -5px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        .crud-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-color), color-mix(in srgb, var(--accent-color), transparent 30%));
        }

        .crud-card.delete::before {
            background: linear-gradient(135deg, #dc3545, color-mix(in srgb, #dc3545, transparent 30%));
        }

        .crud-card .card-header {
            background: transparent;
            border-bottom: 1px solid color-mix(in srgb, var(--default-color), transparent 90%);
            font-family: var(--heading-font);
            font-weight: 600;
            color: var(--heading-color);
            padding: 1rem 1.5rem;
        }

        .crud-card .card-body {
            padding: 1.5rem;
        }

        .crud-card .form-control {
            border-color: color-mix(in srgb, var(--default-color), transparent 85%);
            color: var(--default-color);
        }

        .crud-card .form-control:focus,
        .crud-card .form-check-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem color-mix(in srgb, var(--accent-color), transparent 80%);
        }

        .crud-card .form-check-input:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .crud-card pre,
        .crud-card .alert {
            margin-top: 1rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body class="index-page">

<section class="hero section">
    <div class="container" style="max-width: 600px">
        <h1 class="hero-title">S3 Three-Tier Web Application</h1>

        <div class="card crud-card mt-3">
            <div class="card-header">GET Request - cloudwithdarvin.com</div>
            <div class="card-body">
                <div class="input-group input-group-sm">
                    <button class="btn btn-sm btn-primary" onclick="getAllData()">Get All</button>

                    <input type="text" id="get-id" class="form-control ms-2" placeholder="Id">
                    <button class="btn btn-sm btn-primary" onclick="getDataById()">Get by Id</button>

                    <input type="text" id="get-title" class="form-control ms-2" placeholder="Title">
                    <button class="btn btn-sm btn-primary" onclick="getDataByTitle()">Find By Title</button>

                    <button class="btn btn-sm btn-warning ms-2" onclick="clearGetOutput()">Clear</button>
                </div>

                <div id="getResult"></div>
            </div>
        </div>

        <div class="card crud-card mt-3">
            <div class="card-header">POST Request - cloudwithdarvin.com</div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" class="form-control" id="post-title" placeholder="Title">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="post-description" placeholder="Description">
                </div>
                <button class="btn btn-sm btn-primary" onclick="postData()">Post Data</button>
                <button class="btn btn-sm btn-warning" onclick="clearPostOutput()">Clear</button>

                <div id="postResult"></div>
            </div>
        </div>

        <div class="card crud-card mt-3">
            <div class="card-header">PUT Request - cloudwithdarvin.com</div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" class="form-control" id="put-id" placeholder="Id">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="put-title" placeholder="Title">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="put-description" placeholder="Description">
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="put-published">
                    <label class="form-check-label" for="put-published">Publish</label>
                </div>
                <div class="mt-3">
                    <button class="btn btn-sm btn-primary" onclick="putData()">Update Data</button>
                    <button class="btn btn-sm btn-warning" onclick="clearPutOutput()">Clear</button>
                </div>

                <div id="putResult"></div>
            </div>
        </div>

        <div class="card crud-card delete mt-3">
            <div class="card-header">DELETE Request - cloudwithdarvin.com</div>
            <div class="card-body">
                <div class="input-group input-group-sm">
                    <button class="btn btn-sm btn-danger" onclick="deleteAllData()">Delete All</button>

                    <input type="text" id="delete-id" class="form-control ms-2" placeholder="Id">
                    <button class="btn btn-sm btn-danger" onclick="deleteDataById()">Delete by Id</button>

                    <button class="btn btn-sm btn-warning ms-2" onclick="clearDeleteOutput()">Clear</button>
                </div>

                <div id="deleteResult"></div>
            </div>
        </div>
    </div>
</section>

<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script src="assets/js/main.js"></script>
</body>
</html>
